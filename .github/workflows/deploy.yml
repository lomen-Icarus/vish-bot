name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Package release
        run: |
          mkdir -p release
          cp -r dist index.js package.json package-lock.json .env.example release/
          tar -C release -czf release.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: release.tar.gz
          retention-days: 7

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      PANEL_URL: ${{ secrets.PTERO_PANEL_URL }}
      SERVER_ID: ${{ secrets.PTERO_SERVER_ID }}
      API_KEY: ${{ secrets.PTERO_API_KEY }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
      - name: Upload release to the panel
        run: |
          set -euo pipefail
          api() { curl -sS --fail-with-body -H "Authorization: Bearer $API_KEY" -H "Accept: application/json" "$@"; }
          upload_url=$(api "$PANEL_URL/api/client/servers/$SERVER_ID/files/upload" | python3 -c 'import json,sys; print(json.load(sys.stdin)["attributes"]["url"])')
          curl -sS --fail-with-body -F "files=@release.tar.gz" "$upload_url&directory=%2F"
          api -X POST -H "Content-Type: application/json" "$PANEL_URL/api/client/servers/$SERVER_ID/files/decompress" \
            -d '{"root":"/","file":"release.tar.gz"}'
          api -X POST -H "Content-Type: application/json" "$PANEL_URL/api/client/servers/$SERVER_ID/files/delete" \
            -d '{"root":"/","files":["release.tar.gz"]}'
      - name: Restart the server
        run: |
          set -euo pipefail
          curl -sS --fail-with-body -X POST -H "Authorization: Bearer $API_KEY" -H "Accept: application/json" -H "Content-Type: application/json" \
            "$PANEL_URL/api/client/servers/$SERVER_ID/power" -d '{"signal":"restart"}'
          echo "restart signal sent"
