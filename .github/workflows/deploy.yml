name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Package release
        run: |
          mkdir -p release
          cp -r dist index.js package.json package-lock.json .env.example release/
          # The hosting egg runs "npm install" on every start; keep it lean and quiet.
          printf 'omit=dev\naudit=false\nfund=false\n' > release/.npmrc
          tar -C release -czf release.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: release.tar.gz
          retention-days: 7

  # Отдельный сервер записи вебинаров. Два варианта, каждый включается своими
  # секретами (нет секретов — шаг просто не выполняется):
  #  • VPS по SSH + Docker: RECORDER_SSH_HOST и RECORDER_SSH_KEY (плюс по
  #    желанию RECORDER_SSH_USER, RECORDER_SSH_PORT, RECORDER_SSH_KNOWN_HOSTS);
  #  • сервер в панели Pterodactyl: PTERO_RECORDER_SERVER_ID.
  recorder:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      PANEL_URL: ${{ secrets.PTERO_PANEL_URL }}
      SERVER_ID: ${{ secrets.PTERO_RECORDER_SERVER_ID }}
      API_KEY: ${{ secrets.PTERO_API_KEY }}
      SSH_HOST: ${{ secrets.RECORDER_SSH_HOST }}
      SSH_USER: ${{ secrets.RECORDER_SSH_USER }}
      SSH_PORT: ${{ secrets.RECORDER_SSH_PORT }}
      SSH_KEY: ${{ secrets.RECORDER_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.RECORDER_SSH_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy recorder to the VPS (SSH + Docker)
        if: env.SSH_HOST != '' && env.SSH_KEY != ''
        run: |
          set -euo pipefail
          (cd recorder && npm ci --no-audit --no-fund && npm run typecheck)
          user="${SSH_USER:-root}"
          port="${SSH_PORT:-22}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Отпечаток сервера: из секрета, если задан, иначе — как ответит сервер.
          if [ -n "${SSH_KNOWN_HOSTS:-}" ]; then printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts; else ssh-keyscan -T 20 -p "$port" -H "$SSH_HOST" > ~/.ssh/known_hosts; fi
          opts=(-i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20)
          tar -C recorder --exclude=./node_modules --exclude=./dist --exclude=./data --exclude=./.env -czf recorder-src.tar.gz .
          scp "${opts[@]}" -P "$port" recorder-src.tar.gz recorder/deploy/vps-update.sh "$user@$SSH_HOST:/tmp/"
          ssh "${opts[@]}" -p "$port" "$user@$SSH_HOST" "bash /tmp/vps-update.sh /tmp/recorder-src.tar.gz"
      # Путь через панель — только если записывалка не на VPS: оставшийся
      # PTERO_RECORDER_SERVER_ID не должен делать деплой VPS красным.
      - name: Build recorder
        if: env.SERVER_ID != '' && env.SSH_HOST == ''
        working-directory: recorder
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm run build
          mkdir -p release
          cp -r dist package.json package-lock.json .env.example README.md release/
          printf 'omit=dev\naudit=false\nfund=false\n' > release/.npmrc
          tar -C release -czf ../recorder.tar.gz .
      - name: Upload recorder to the panel
        if: env.SERVER_ID != '' && env.SSH_HOST == ''
        run: |
          set -euo pipefail
          api() { curl -sS --fail-with-body -H "Authorization: Bearer $API_KEY" -H "Accept: application/json" "$@"; }
          status=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $API_KEY" -H "Accept: application/json" "$PANEL_URL/api/client/servers/$SERVER_ID" || true)
          if [ "$status" = "404" ]; then
            echo "::error::Сервера PTERO_RECORDER_SERVER_ID нет в панели Pterodactyl (404). Если записывалка на обычном VPS — удали секрет PTERO_RECORDER_SERVER_ID и задай RECORDER_SSH_HOST и RECORDER_SSH_KEY (docs/DEPLOY.md, «Вариант А»)."
            exit 1
          fi
          upload_url=$(api "$PANEL_URL/api/client/servers/$SERVER_ID/files/upload" | python3 -c 'import json,sys; print(json.load(sys.stdin)["attributes"]["url"])')
          curl -sS --fail-with-body -F "files=@recorder.tar.gz" "$upload_url&directory=%2F"
          api -X POST -H "Content-Type: application/json" "$PANEL_URL/api/client/servers/$SERVER_ID/files/decompress" -d '{"root":"/","file":"recorder.tar.gz"}'
          api -X POST -H "Content-Type: application/json" "$PANEL_URL/api/client/servers/$SERVER_ID/files/delete" -d '{"root":"/","files":["recorder.tar.gz"]}'
          curl -sS --fail-with-body -X POST -H "Authorization: Bearer $API_KEY" -H "Accept: application/json" -H "Content-Type: application/json" \
            "$PANEL_URL/api/client/servers/$SERVER_ID/power" -d '{"signal":"restart"}'

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      PANEL_URL: ${{ secrets.PTERO_PANEL_URL }}
      SERVER_ID: ${{ secrets.PTERO_SERVER_ID }}
      API_KEY: ${{ secrets.PTERO_API_KEY }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
      - name: Upload release to the panel
        run: |
          set -euo pipefail
          api() { curl -sS --fail-with-body -H "Authorization: Bearer $API_KEY" -H "Accept: application/json" "$@"; }
          upload_url=$(api "$PANEL_URL/api/client/servers/$SERVER_ID/files/upload" | python3 -c 'import json,sys; print(json.load(sys.stdin)["attributes"]["url"])')
          curl -sS --fail-with-body -F "files=@release.tar.gz" "$upload_url&directory=%2F"
          api -X POST -H "Content-Type: application/json" "$PANEL_URL/api/client/servers/$SERVER_ID/files/decompress" \
            -d '{"root":"/","file":"release.tar.gz"}'
          api -X POST -H "Content-Type: application/json" "$PANEL_URL/api/client/servers/$SERVER_ID/files/delete" \
            -d '{"root":"/","files":["release.tar.gz"]}'
      - name: Restart the server
        run: |
          set -euo pipefail
          curl -sS --fail-with-body -X POST -H "Authorization: Bearer $API_KEY" -H "Accept: application/json" -H "Content-Type: application/json" \
            "$PANEL_URL/api/client/servers/$SERVER_ID/power" -d '{"signal":"restart"}'
          echo "restart signal sent"
